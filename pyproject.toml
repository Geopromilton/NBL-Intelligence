[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nbl-intelligence"
version = "1.1.0"
description = "NBL-Intelligence: AI-native water intelligence platform for Nature Based Living sites"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "httpx>=0.27",
  "python-docx>=1.1",
  "matplotlib>=3.8",
  "tifffile>=2024.1",
  "imagecodecs>=2024.1",
  "pypdf>=4.0",
  "keyring>=24; sys_platform == 'win32'",
  "pywebview>=5.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nbl-intelligence = "nbl_intelligence.__main__:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
