name: AI relay

# Deploys the Cloudflare Worker that lets the website use NVIDIA reasoning.
# Needs repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, NVIDIA_API_KEY, AI_PASSCODE.
on:
  push:
    branches: [main]
    paths: ["relay/**", ".github/workflows/relay.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Check the secrets are present
        id: ready
        env:
          K: ${{ secrets.NVIDIA_API_KEY }}
          P: ${{ secrets.AI_PASSCODE }}
        run: |
          miss=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && miss="$miss CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && miss="$miss CLOUDFLARE_ACCOUNT_ID"
          [ -z "$K" ] && miss="$miss NVIDIA_API_KEY"
          [ -z "$P" ] && miss="$miss AI_PASSCODE"
          if [ -n "$miss" ]; then echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::AI relay not deployed. Missing secrets:$miss (see docs/website-ai.md)."; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - name: Check the Cloudflare token
        if: steps.ready.outputs.ok == 'true'
        working-directory: relay
        run: |
          out=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "$out" | grep -q '"status":"active"' || { echo "::error::The Cloudflare API token is not valid or not active. Create a new one with the 'Edit Cloudflare Workers' template."; exit 1; }
          id=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          [ "$id" != "$CLOUDFLARE_ACCOUNT_ID" ] && echo "::notice::Removed spaces or line breaks from CLOUDFLARE_ACCOUNT_ID."
          list=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")
          ids=$(echo "$list" | python3 -c "import json,sys; d=json.load(sys.stdin); print(' '.join(a['id'] for a in d.get('result') or []))")
          n=$(echo $ids | wc -w)
          echo "The token can reach $n Cloudflare account(s)."
          if echo " $ids " | grep -q " $id "; then echo "CLOUDFLARE_ACCOUNT_ID matches an account the token can reach.";
          elif [ "$n" = "1" ]; then id=$ids; echo "::warning::CLOUDFLARE_ACCOUNT_ID does not match; using the only account this token can reach. You can correct the secret later.";
          elif [ "$n" = "0" ]; then echo "::error::The token cannot reach any account. Create the token again with the 'Edit Cloudflare Workers' template and, under Account Resources, choose your account."; exit 1;
          else echo "::error::CLOUDFLARE_ACCOUNT_ID does not match any of the $n accounts this token can reach. Copy the Account ID again from Cloudflare > Workers & Pages."; exit 1; fi
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
          echo "::add-mask::$id"
          sub=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$id/workers/subdomain")
          echo "$sub" | grep -q '"subdomain":"' || echo "::warning::No workers.dev subdomain yet. Open Cloudflare > Workers & Pages once and choose one, then run this workflow again."
          echo "Token and account OK."
      - name: Deploy the relay
        if: steps.ready.outputs.ok == 'true'
        working-directory: relay
        run: npx --yes wrangler@4 deploy 2>&1 | tee /tmp/deploy.log
      - name: Store the NVIDIA key and passcode as relay secrets
        if: steps.ready.outputs.ok == 'true'
        working-directory: relay
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AI_PASSCODE: ${{ secrets.AI_PASSCODE }}
        run: |
          printf '%s' "$NVIDIA_API_KEY" | npx --yes wrangler@4 secret put NVIDIA_API_KEY
          printf '%s' "$AI_PASSCODE" | npx --yes wrangler@4 secret put AI_PASSCODE
      - name: Show the relay address
        if: steps.ready.outputs.ok == 'true'
        run: |
          url=$(grep -o 'https://[^ ]*workers.dev' /tmp/deploy.log | head -1)
          echo "Relay address: $url"
          echo "### Relay address: \`$url\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Set the repository variable AI_RELAY_URL to this address, then run the Website workflow." >> "$GITHUB_STEP_SUMMARY"
          sleep 8; curl -s "$url/health" || true
