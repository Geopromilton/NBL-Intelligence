name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest
      - name: Tests (engine-data tests are skipped on GitHub; they run on the NBL PC)
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: web/dist }

  windows:
    needs: [test, web]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: web/dist }
      - name: Build installer and update package
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NBL-Intelligence-windows
          path: |
            build/installer/*.exe
            build/nbl-intelligence-app.zip
            build/nbl-intelligence-app.zip.sha256
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = if (Test-Path "docs/releases/$tag.md") { "docs/releases/$tag.md" } else { "" }
          $files = @(Get-ChildItem build/installer/*.exe | ForEach-Object FullName) + "build/nbl-intelligence-app.zip", "build/nbl-intelligence-app.zip.sha256"
          if ($notes) { gh release create $tag @files --title "NBL-Intelligence $($tag.TrimStart('v'))" --notes-file $notes }
          else { gh release create $tag @files --title "NBL-Intelligence $($tag.TrimStart('v'))" --generate-notes }
