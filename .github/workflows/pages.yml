name: Website

on:
  push:
    branches: [main]
    paths: ["web/**", "view/**", "assets/brand/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - name: Build the public view (read-only snapshot)
        working-directory: web
        env: { VITE_VIEW: "1", VITE_AI_RELAY: "${{ vars.AI_RELAY_URL }}" }
        run: npx vite build --base=./ --outDir ../site
      - run: cp -r view/snapshot site/snapshot && touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
